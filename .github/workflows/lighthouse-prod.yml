name: Lighthouse producción

# Mide el sitio publicado una vez por semana y guarda los resultados en src/data/lighthouse.json,
# que la página /status muestra. El commit dispara un nuevo deploy en Vercel.
on:
  schedule:
    - cron: '0 11 * * 1' # lunes 08:00 (Argentina)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: lighthouse-prod
  cancel-in-progress: false

env:
  PRODUCTION_URL: https://juanmanueliglesias.vercel.app/

jobs:
  measure:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc

      - name: Medir producción con Lighthouse (3 corridas)
        run: npx --yes @lhci/cli@0.16.1 collect --url="$PRODUCTION_URL" --numberOfRuns=3

      - name: Resumir resultados
        run: node scripts/lighthouse-summary.mjs "$PRODUCTION_URL"

      - name: Commitear si cambió
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/lighthouse.json
          if git diff --cached --quiet; then
            echo "Sin cambios en las métricas."
          else
            git commit -m "chore(status): actualizar métricas de Lighthouse"
            git push
          fi
